version: '3.8'

services:
  insider-monitor:
    build: .
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - TZ=UTC
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=insider
      - DB_PASSWORD=insiderpass
      - DB_NAME=insiderdb
    command: ["-test"]
    depends_on:
      - postgres

  postgres:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=insider
      - POSTGRES_PASSWORD=insiderpass
      - POSTGRES_DB=insiderdb
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: 